<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>The Bench — Demo interattiva</title>
<style>
:root{
  --bg:#152441; --panel:#1c3055; --panel2:#243c68; --line:#33507f;
  --txt:#f2f6fc; --dim:#93a8c9; --acc:#ffc42e; --acc2:#3ddc84;
  --warn:#ffc42e; --bad:#ff5d5d; --blue:#5ea0ff; --viola:#b08bff;
  --navy:#152441; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

/* --- brand The Bench --- */
.check{height:12px;background:repeating-conic-gradient(var(--acc) 0% 25%, var(--navy) 0% 50%) 0/24px 24px;
  border-top:2px solid #0e1a30;border-bottom:2px solid #0e1a30}
.check.thin{height:8px;background-size:16px 16px}
.logo{width:104px;height:104px;border-radius:50%;background:var(--acc);margin:0 auto 20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 10px 30px rgba(0,0,0,.45)}
.logo b{display:block;font-size:15px;font-weight:900;letter-spacing:1px;color:var(--navy);
  line-height:1;transform:skewY(-8deg)}
.logo b.big{font-size:24px;letter-spacing:-.5px;margin-top:3px;
  text-shadow:2px 2px 0 rgba(21,36,65,.25)}
.logo-s{display:flex;align-items:center;gap:9px}
.logo-s .dot{width:34px;height:34px;border-radius:50%;background:var(--acc);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;
  color:var(--navy);transform:skewY(-8deg);letter-spacing:-.3px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{cursor:default}
.wrap{max-width:1200px;margin:0 auto;padding:0 0 70px}

.roles{position:sticky;top:0;z-index:50;background:#0e1a30;border-bottom:1px solid var(--line);
  display:flex;gap:4px;padding:8px;overflow-x:auto;align-items:center}
.roles button{padding:8px 14px;border-radius:99px;color:var(--dim);font-size:13px;font-weight:700;white-space:nowrap}
.roles button.on{background:var(--acc);color:var(--navy)}
.roles .demo-brand{font-size:11px;font-weight:800;color:var(--acc);
  padding:5px 12px;border-radius:99px;background:rgba(255,196,46,.12);
  border:1px solid rgba(255,196,46,.35);letter-spacing:1px;white-space:nowrap;margin-right:6px}
.hint{font-size:12px;color:var(--dim);padding:10px 14px;background:#101d36;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:12px}
.hint .tour-restart{background:var(--acc);color:var(--navy);padding:6px 12px;border-radius:99px;
  font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;flex-shrink:0}

.phone{max-width:460px;margin:0 auto;padding:14px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.head h1{font-size:20px;margin:0;letter-spacing:-.3px}
.tavolo{font-size:12px;color:var(--dim)}
.badge{background:var(--panel2);border:1px solid var(--line);padding:5px 10px;border-radius:99px;font-size:12px;color:var(--dim)}

/* --- QR LANDING --- */
.qr-page{min-height:calc(100vh - 80px);background:linear-gradient(180deg, #0a1428 0%, #152441 60%, #1a2d55 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;
  animation:fadeIn .5s ease}
.qr-page .logo{margin-bottom:24px;animation:pop .6s cubic-bezier(.34,1.56,.64,1)}
.qr-page h1{font-size:26px;margin:0 0 6px;letter-spacing:-.5px}
.qr-page .sub{color:var(--dim);margin-bottom:32px;font-size:14px;max-width:340px}
.qr-frame{width:250px;height:250px;background:#fff;border-radius:24px;padding:22px;
  box-shadow:0 24px 64px rgba(255,196,46,.28), 0 0 0 3px rgba(255,196,46,.15);
  position:relative;margin-bottom:22px}
.qr-frame svg{width:100%;height:100%;display:block}
.qr-scan{position:absolute;left:22px;right:22px;height:3px;background:var(--acc);border-radius:2px;
  box-shadow:0 0 24px var(--acc),0 0 44px rgba(255,196,46,.6);animation:scan 1.8s ease-in-out infinite}
.qr-corners{position:absolute;inset:12px;pointer-events:none}
.qr-corners span{position:absolute;width:22px;height:22px;border:3px solid var(--acc)}
.qr-corners span:nth-child(1){top:0;left:0;border-right:none;border-bottom:none;border-radius:6px 0 0 0}
.qr-corners span:nth-child(2){top:0;right:0;border-left:none;border-bottom:none;border-radius:0 6px 0 0}
.qr-corners span:nth-child(3){bottom:0;left:0;border-right:none;border-top:none;border-radius:0 0 0 6px}
.qr-corners span:nth-child(4){bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 6px 0}
@keyframes scan{0%,100%{top:22px}50%{top:222px}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.qr-instr{color:var(--acc);font-weight:700;font-size:15px;margin-bottom:16px;letter-spacing:.3px}
.qr-tavolo{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;
  padding:12px 22px;font-size:13px;color:var(--dim);margin-bottom:18px}
.qr-tavolo b{color:var(--acc);font-size:15px;letter-spacing:1px}
.qr-open{padding:14px 30px;background:var(--acc);color:var(--navy);
  border-radius:99px;font-weight:800;font-size:14px;letter-spacing:.4px;
  box-shadow:0 10px 24px rgba(255,196,46,.35);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 10px 24px rgba(255,196,46,.35)}
  50%{transform:scale(1.04);box-shadow:0 14px 34px rgba(255,196,46,.55)}}
.qr-foot{color:var(--dim);font-size:11px;margin-top:22px;letter-spacing:.3px;opacity:.7}

/* --- SETUP TABLET (primo avvio) --- */
.setup-page{min-height:calc(100vh - 80px);background:linear-gradient(180deg,#0a1428 0%,#152441 100%);
  padding:40px 20px;display:flex;align-items:center;justify-content:center;animation:fadeIn .4s}
.setup-box{max-width:520px;width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:22px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.setup-box .stp{display:inline-block;background:var(--acc);color:var(--navy);padding:5px 12px;
  border-radius:99px;font-weight:800;font-size:11px;letter-spacing:1.2px;margin-bottom:10px}
.setup-box h1{font-size:24px;margin:0 0 6px;letter-spacing:-.5px}
.setup-box .ssub{color:var(--dim);font-size:14px;margin-bottom:22px;line-height:1.5}
.stat-card{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:16px;
  margin-bottom:10px;cursor:pointer;display:flex;gap:14px;align-items:center;transition:.15s;width:100%;text-align:left}
.stat-card:hover{border-color:var(--acc);transform:translateX(4px)}
.stat-card.sel{border-color:var(--acc);background:#2a3b63}
.stat-card .si{width:48px;height:48px;border-radius:12px;background:var(--panel);
  display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.stat-card .st{font-weight:800;font-size:16px}
.stat-card .sd{font-size:12px;color:var(--dim);margin-top:2px}
.pin-input{display:flex;justify-content:center;gap:10px;margin:20px 0}
.pin-input input{width:52px;height:64px;text-align:center;font-size:28px;font-weight:800;
  background:var(--panel2);border:2px solid var(--line);border-radius:12px;color:var(--acc);
  caret-color:var(--acc)}
.pin-input input:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 4px rgba(255,196,46,.15)}
.setup-done{text-align:center;padding:30px 0}
.setup-done .sd-i{font-size:60px;color:var(--acc2);margin-bottom:8px}
.setup-done h2{margin:0 0 6px;color:var(--acc2)}
.setup-done p{color:var(--dim);font-size:13.5px}
.dev-line{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:12.5px}
.dev-line b{color:var(--acc)}

/* --- REPORT GIORNALIERO --- */
.rep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;
  border-left:4px solid var(--acc)}
.kpi.g{border-left-color:var(--acc2)}
.kpi.v{border-left-color:var(--viola)}
.kpi.b{border-left-color:var(--blue)}
.kpi .kl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1.3px;margin-bottom:6px}
.kpi .kv{font-size:26px;font-weight:900;letter-spacing:-1px;color:var(--acc)}
.kpi.g .kv{color:var(--acc2)}
.kpi.v .kv{color:var(--viola)}
.kpi.b .kv{color:var(--blue)}
.kpi .ks{font-size:11.5px;color:var(--dim);margin-top:4px}
.rep-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.rep-card h4{margin:0 0 14px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.rep-card h4 small{font-size:12px;color:var(--dim);font-weight:400}
.hbar{display:grid;grid-template-columns:120px 1fr 80px;gap:10px;align-items:center;margin-bottom:9px;font-size:13px}
.hbar .hn{color:var(--dim)}
.hbar .hp{position:relative;height:22px;background:var(--panel2);border-radius:6px;overflow:hidden}
.hbar .hpf{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--acc) 0%,#ffb800 100%);
  border-radius:6px;transition:width .8s cubic-bezier(.34,1.56,.64,1)}
.hbar.g .hpf{background:linear-gradient(90deg,var(--acc2) 0%,#2dbd6b 100%)}
.hbar.b .hpf{background:linear-gradient(90deg,var(--blue) 0%,#3d78d6 100%)}
.hbar.v .hpf{background:linear-gradient(90deg,var(--viola) 0%,#8b6cd9 100%)}
.hbar .hv{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.top-list{list-style:none;padding:0;margin:0}
.top-list li{display:grid;grid-template-columns:24px 1fr auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);
  align-items:center;font-size:13.5px}
.top-list li:last-child{border-bottom:none}
.top-list .tr{color:var(--acc);font-weight:800;font-size:16px;text-align:center}
.top-list .tq{color:var(--dim);font-size:12px;font-weight:600}
.time-row{display:grid;grid-template-columns:100px 1fr auto;gap:12px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.time-row:last-child{border-bottom:none}
.time-row .tp{position:relative;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.time-row .tpf{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:4px}
.time-row.hot .tpf{background:var(--bad)}
.time-row .tt{font-weight:700;color:var(--acc);white-space:nowrap;font-variant-numeric:tabular-nums}
.time-row.hot .tt{color:var(--bad)}
.peaks{display:flex;gap:6px;align-items:flex-end;height:120px;padding-top:12px}
.peak{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.peak .pb{width:100%;background:linear-gradient(180deg,var(--acc) 0%,#ffb800 100%);
  border-radius:6px 6px 0 0;min-height:4px;transition:height 1s cubic-bezier(.34,1.56,.64,1);
  position:relative}
.peak .pb b{position:absolute;top:-18px;left:50%;transform:translateX(-50%);color:var(--acc);
  font-size:11px;font-weight:800}
.peak .pl{font-size:10.5px;color:var(--dim);font-weight:700}
.rep-note{background:rgba(255,196,46,.08);border-left:3px solid var(--acc);padding:10px 12px;
  border-radius:6px;font-size:12.5px;color:var(--dim);margin-top:12px;line-height:1.5}

/* --- SOLD-OUT MODAL (cliente) --- */
.so-mask{position:fixed;inset:0;background:rgba(6,12,26,.92);z-index:190;
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fadeIn .3s ease}
.so-card{background:linear-gradient(180deg,#3a1e2a 0%,var(--panel) 100%);
  border:2px solid var(--bad);border-radius:22px;padding:24px;
  max-width:440px;width:100%;
  box-shadow:0 24px 60px rgba(255,93,93,.4),0 0 0 4px rgba(255,93,93,.1)}
.so-card h3{margin:0 0 4px;font-size:20px;color:var(--bad)}
.so-card .sos{color:var(--txt);font-size:14px;margin-bottom:14px;line-height:1.4}
.so-card .sos b{color:var(--acc)}
.so-timer{display:flex;align-items:center;gap:14px;background:rgba(0,0,0,.35);
  padding:12px 16px;border-radius:12px;margin-bottom:16px}
.so-ring{width:56px;height:56px;flex-shrink:0;position:relative}
.so-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.so-ring circle{fill:none;stroke-width:5}
.so-ring .bg-r{stroke:rgba(255,255,255,.1)}
.so-ring .fg-r{stroke:var(--acc);transition:stroke-dashoffset .5s linear}
.so-ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;color:var(--acc)}
.so-timer .st{flex:1;font-size:12.5px;color:var(--dim)}
.so-timer .st b{color:var(--txt);display:block;font-size:14px;margin-bottom:2px}
.so-opt{display:flex;gap:12px;background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:13px;margin-bottom:9px;width:100%;text-align:left;
  align-items:center;cursor:pointer;transition:.15s}
.so-opt:hover{border-color:var(--acc);transform:translateX(3px)}
.so-opt .soi{font-size:24px;line-height:1;flex-shrink:0}
.so-opt .sot{font-weight:700;font-size:14px}
.so-opt .sod{font-size:11.5px;color:var(--dim);margin-top:2px}

/* KDS "articolo esaurito" button */
.kds-so-btn{margin-top:6px;background:transparent;color:var(--dim);border:1px dashed var(--line);
  border-radius:8px;padding:6px 10px;font-size:11.5px;width:100%;cursor:pointer;transition:.15s}
.kds-so-btn:hover{color:var(--bad);border-color:var(--bad)}
.so-picker{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:210;
  display:flex;align-items:center;justify-content:center;padding:20px}
.so-pick-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:16px;max-width:340px;width:100%}
.so-pick-card h4{margin:0 0 10px;font-size:15px}
.so-pick-item{display:flex;justify-content:space-between;padding:10px 12px;
  background:var(--panel2);border-radius:8px;margin-bottom:6px;cursor:pointer;
  border:1px solid transparent}
.so-pick-item:hover{border-color:var(--bad);color:var(--bad)}

/* --- HELP MODAL --- */
.help-mask{position:fixed;inset:0;background:rgba(6,12,26,.85);z-index:180;
  display:flex;align-items:center;justify-content:center;padding:20px;
  backdrop-filter:blur(2px);animation:fadeIn .25s ease}
.help-card{background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:22px;max-width:400px;width:100%;
  box-shadow:0 24px 60px rgba(0,0,0,.6);animation:slideUp .35s cubic-bezier(.34,1.56,.64,1)}
.help-card h3{margin:0 0 6px;font-size:19px}
.help-card .hs{color:var(--dim);font-size:13px;margin-bottom:18px}
.help-opt{display:flex;gap:12px;background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:14px;margin-bottom:9px;width:100%;text-align:left;
  align-items:center;transition:transform .15s;cursor:pointer}
.help-opt:hover{transform:translateX(3px);border-color:var(--acc)}
.help-opt .hi{font-size:26px;line-height:1;flex-shrink:0}
.help-opt .ht{font-weight:700;font-size:14.5px}
.help-opt .hd{font-size:12px;color:var(--dim);margin-top:2px}
.help-close{background:transparent;color:var(--dim);width:100%;padding:12px;margin-top:8px;
  font-size:13px}
.help-card textarea{width:100%;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:12px;color:var(--txt);font:inherit;min-height:100px;
  resize:vertical;margin:8px 0}
.help-sent{background:#0d2a1a;border:1px solid var(--acc2);border-radius:12px;
  padding:16px;text-align:center;margin-top:10px}
.help-sent .hs2{font-size:14px;color:var(--acc2);font-weight:700}
.help-sent .hs3{font-size:12px;color:#a8d8bf;margin-top:4px}

/* --- AGGIUNGI AL MIO ORDINE --- */
.adding-banner{background:linear-gradient(90deg,var(--acc) 0%,#ffb800 100%);
  color:var(--navy);padding:12px 16px;border-radius:12px;margin-bottom:14px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  box-shadow:0 4px 14px rgba(255,196,46,.35);animation:slideDown .3s ease}
@keyframes slideDown{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.adding-banner .ab-t{font-weight:800;font-size:14px}
.adding-banner .ab-s{font-size:11.5px;opacity:.85;margin-top:2px}
.adding-banner button{background:var(--navy);color:var(--acc);padding:8px 14px;
  border-radius:99px;font-weight:700;font-size:12px;flex-shrink:0}
.add-order-btn{width:100%;padding:14px;background:var(--panel2);color:var(--acc);
  border:2px dashed var(--acc);border-radius:12px;font-weight:700;font-size:14px;
  margin-top:14px;letter-spacing:.3px}
.add-order-btn:hover{background:#2a3b63}

/* --- TOUR OVERLAY --- */
.tour-mask{position:fixed;inset:0;background:rgba(6,12,26,.82);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;padding:20px;
  backdrop-filter:blur(3px);animation:fadeIn .3s ease}
.tour-card{background:linear-gradient(180deg, var(--panel) 0%, var(--panel2) 100%);
  border:2px solid var(--acc);border-radius:22px;padding:24px;
  max-width:480px;width:100%;position:relative;
  box-shadow:0 24px 60px rgba(0,0,0,.6), 0 0 0 6px rgba(255,196,46,.08);
  margin-bottom:80px;animation:slideUp .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.tour-badge{position:absolute;top:-15px;left:20px;background:var(--acc);color:var(--navy);
  padding:6px 14px;border-radius:99px;font-weight:800;font-size:11px;letter-spacing:1.2px}
.tour-card h3{margin:8px 0 10px;font-size:19px;letter-spacing:-.2px}
.tour-card p{color:var(--txt);font-size:14px;line-height:1.55;margin:0}
.tour-card .tip{background:rgba(255,196,46,.08);border-left:3px solid var(--acc);
  padding:10px 12px;border-radius:6px;margin-top:12px;font-size:13px;color:var(--dim)}
.tour-card .tip b{color:var(--acc)}
.tour-progress{display:flex;gap:5px;margin-top:18px}
.tour-progress span{flex:1;height:4px;background:var(--line);border-radius:2px;transition:.3s}
.tour-progress span.on{background:var(--acc);box-shadow:0 0 8px rgba(255,196,46,.5)}
.tour-progress span.done{background:rgba(255,196,46,.4)}
.tour-actions{display:flex;gap:10px;margin-top:16px}
.tour-actions button{padding:12px 18px;border-radius:11px;font-weight:700;font-size:14px}
.tour-skip{background:transparent;color:var(--dim);padding:12px 14px !important}
.tour-back{background:var(--panel);color:var(--txt);border:1px solid var(--line)}
.tour-next{background:var(--acc);color:var(--navy);flex:1;box-shadow:0 6px 16px rgba(255,196,46,.3)}
.tour-start-fab{position:fixed;bottom:20px;right:20px;z-index:60;background:var(--acc);color:var(--navy);
  padding:14px 20px;border-radius:99px;font-weight:800;font-size:13px;letter-spacing:.5px;
  box-shadow:0 10px 28px rgba(0,0,0,.5);display:flex;align-items:center;gap:8px;
  animation:pulse 2.5s ease-in-out infinite}

/* login */
.login{max-width:400px;margin:0 auto;padding:40px 20px;animation:fadeIn .4s ease}
.login h1{font-size:26px;margin:0 0 6px;letter-spacing:-.5px}
.login .sub{color:var(--dim);font-size:14px;margin-bottom:26px}
.why{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;
  font-size:12.5px;color:var(--dim);margin:14px 0}

.cat{margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.cat h2{font-size:15px;margin:0;text-transform:uppercase;letter-spacing:1.2px;color:var(--acc)}
.eta{font-size:12px;color:var(--dim)}
.eta.hot{color:var(--warn)}

function queueOf(st){return orders.flatMap(o=>o.righe)
  .filter(r=>(r.staz===st||(st==='bar'&&r.staz==='frigo'))&&['queued','preparing'].includes(r.stato)).length}
function etaOf(cid){const c=cat(cid),q=queueOf(c.staz);
  return Math.round(c.prep+Math.max(0,q-2)*(c.prep/3.5))}
function isOut(it){const c=cat(it.c);return it.out||queueOf(c.staz)>=c.max}
function hasFood(){return Object.keys(cart).some(id=>cat(item(+id).c).staz==='cucina')}

function drawRoles(){

    ROLES.map(([r,l])=>
    `<button class="${r===role?'on':''}" onclick="setRole('${r}')">${l}</button>`).join('');

    `<span>${HINTS[role]}</span>` +
    (tourStep<0 ? `<button class="tour-restart" onclick="startTour()">🎬 Tour guidato</button>` : '');

function setRole(r){role=r;if(r==='cliente'&&!user)view='qr';drawRoles();draw()}
function draw(){
  // Setup tablet: se il ruolo è bar/cucina/cassa e non è ancora configurato → wizard
  if(['bar','cucina','cassa'].includes(role) && !deviceConfigured[role]){
    app().innerHTML=viewSetupTablet(role);
  }
  else if(role==='cliente')    app().innerHTML=viewCliente();
  else if(role==='tv')    app().innerHTML=viewTV();
  else if(role==='cassa') app().innerHTML=viewCassa();
  else if(role==='admin') app().innerHTML=viewAdmin();
  else                    app().innerHTML=viewKDS(role);
  // Sold-out modal: appare solo se il cliente è in vista e c'è un evento pending sul suo ordine
  if(role==='cliente' && soldOutEvents.some(e=>e.status==='pending')) renderSoldOutModal();

let tourStep = -1;
function startTour(){tourStep=0;showTourStep()}
function nextTour(){tourStep++;showTourStep()}
function backTour(){if(tourStep>0){tourStep--;showTourStep()}}
function closeTour(){tourStep=-1;document.getElementById('tourMask').innerHTML='';
  drawRoles();document.getElementById('tourFab').style.display='none';
  try{localStorage.setItem('tb_tour_seen','1')}catch(e){}}
function showTourStep(){
  if(tourStep<0||tourStep>=TOUR.length){closeTour();return}
  const s=TOUR[tourStep];
  role=s.role;
  if(s.role==='cliente'){
    if(s.view==='qr'){user=null;view='qr'}
    else if(s.view==='login'){user=null;view='login'}
    else if(s.view==='menu'){user={nome:'Marco',email:'marco.r@gmail.com',tel:'333 1234567',mkt:false};view='menu';cart={}}
  }
  if(s.role==='admin') adminOk=true;
  drawRoles();draw();renderTour();
}
function renderTour(){
  const s=TOUR[tourStep];
  const pct = TOUR.map((_,i)=>i<tourStep?'done':(i===tourStep?'on':'')).map(c=>`<span class="${c}"></span>`).join('');
  document.getElementById('tourMask').innerHTML = `
    <div class="tour-mask">
      <div class="tour-card">
        <div class="tour-badge">STEP ${tourStep+1} / ${TOUR.length}</div>
        <h3>${s.title}</h3>
        <p>${s.text}</p>
        <div class="tip">💡 ${s.tip}</div>
        <div class="tour-progress">${pct}</div>
        <div class="tour-actions">
          <button class="tour-skip" onclick="closeTour()">Salta</button>
          ${tourStep>0 ? '<button class="tour-back" onclick="backTour()">← Indietro</button>' : ''}
          <button class="tour-next" onclick="nextTour()">${tourStep===TOUR.length-1?'Termina tour ✓':'Prossimo →'}</button>
        </div>
      </div>
    </div>`;
}

function qrSvg(){
  // QR-like decorative pattern (non funzionale, solo visivo)
  const cells = 21;
  let squares = '';
  const fixed = [[0,0],[0,cells-7],[cells-7,0]];
  fixed.forEach(([r,c])=>{
    squares += `<rect x="${c*10}" y="${r*10}" width="70" height="70" fill="#152441"/>
                <rect x="${c*10+10}" y="${r*10+10}" width="50" height="50" fill="#fff"/>
                <rect x="${c*10+20}" y="${r*10+20}" width="30" height="30" fill="#152441"/>`;
  });
  const seed=[[3,3,1],[3,4,0],[3,5,1],[3,6,1],[3,7,0],[3,8,1],[3,9,1],[3,10,0],[3,11,1],
    [4,3,0],[4,5,1],[4,7,0],[4,9,1],[4,11,0],[4,13,1],
    [5,3,1],[5,4,1],[5,5,0],[5,7,1],[5,9,0],[5,11,1],[5,13,0],[5,14,1],
    [6,4,0],[6,5,1],[6,6,1],[6,8,0],[6,10,1],[6,12,0],[6,13,1],
    [7,3,1],[7,4,0],[7,5,1],[7,7,1],[7,9,1],[7,11,0],[7,13,1],[7,14,0],
    [8,4,1],[8,6,0],[8,8,1],[8,10,0],[8,12,1],[8,14,1],
    [9,3,0],[9,5,1],[9,7,0],[9,9,1],[9,11,1],[9,13,0],[9,14,1],
    [10,4,1],[10,5,0],[10,7,1],[10,9,0],[10,11,1],[10,13,1],
    [11,3,1],[11,4,1],[11,6,0],[11,8,1],[11,10,0],[11,12,1],[11,14,0],
    [12,3,0],[12,5,1],[12,7,1],[12,9,0],[12,11,1],[12,13,0],[12,14,1],
    [13,4,1],[13,6,0],[13,8,1],[13,10,1],[13,12,0],[13,14,1],
    [14,3,1],[14,4,0],[14,5,1],[14,7,0],[14,9,1],[14,11,0],[14,13,1]];
  seed.forEach(([r,c,v])=>{if(v)squares+=`<rect x="${c*10}" y="${r*10}" width="10" height="10" fill="#152441"/>`});
  return `<svg viewBox="0 0 210 210" xmlns="http://www.w3.org/2000/svg">${squares}</svg>`;

function invia(){
  const misto=hasFood()&&hasDrink(), mode=misto?timing:'subito';
  const righe=Object.entries(cart).map(([id,q])=>{
    const it=item(+id), st=cat(it.c).staz;
    const held = mode==='insieme' && isDrink(st);
    return {n:it.n,q,staz:st,stato:held?'held':'preparing'};
  });
  if(addingTo){
    const o=orders.find(x=>x.id===addingTo);
    o.righe.push(...righe);
    o.tot += total();
    log('cliente','ordine',`Ordine #${addingTo} INCREMENTATO · +${righe.length} righe · +${eur(total())}`);
    addingTo=null;
  } else {
    const eta=Math.max(...Object.keys(cart).map(id=>etaOf(item(+id).c)));
    orders.push({id:++seq,nome:user.nome,email:user.email,righe,tot:total(),mode,
      stato:'aperto',mine:true,t0:now(),eta,askedAt:now(),confirmed:true,paid:false});
    log('cliente','ordine',`Ordine #${seq} creato · ${righe.length} righe · ${eur(total())} · bibite: ${mode}`);
  }
  cart={};view='menu';draw();
}

function grouped(o){
  const g={};
  o.righe.forEach(r=>{const k=isDrink(r.staz)?'bar':'cucina';(g[k]=g[k]||[]).push(r)});
  return g;
}
function stGroup(rs){
  if(rs.every(r=>r.stato==='collected')) return 'collected';
  if(rs.every(r=>['ready','collected'].includes(r.stato))) return 'ready';
  if(rs.some(r=>r.stato==='preparing')) return 'preparing';
  if(rs.every(r=>r.stato==='held')) return 'held';
  return 'queued';
}
const PILL={held:['hold','in attesa del cibo'],queued:['wait','in coda'],
  preparing:['prep','in preparazione'],ready:['rdy','PRONTO — ritira'],collected:['wait','ritirato']};

function stato(o){
  const g=grouped(o), anyReady=o.righe.some(r=>r.stato==='ready');
  let h=`<div class="check thin"></div><div class="phone"><div class="num"><div class="lbl">Ordine numero</div>
    <div class="v">${o.id}</div></div>`;

  if(anyReady){
    const dove=Object.entries(g).filter(([k,rs])=>stGroup(rs)==='ready')
      .map(([k])=>k==='bar'?'Banco BAR':'Banco CUCINA').join(' e ');
    h+=`<div class="ready"><h3>✅ Pronto!</h3>
      <p>Ritira al <b>${dove}</b> con il numero <b>${o.id}</b>.
      ${o.paid?'Già pagato.':'Paghi lì, una volta sola: '+eur(o.tot)}</p></div>`;
  }

  for(const [k,rs] of Object.entries(g)){
    const s=stGroup(rs), [cl,txt]=PILL[s];
    h+=`<div class="desk"><div class="dh"><div class="dn">${k==='bar'?'🍹 Banco BAR':'🍕 Banco CUCINA'}</div>
      <span class="pill ${cl}">${txt}</span></div>`;
    rs.forEach(r=>h+=`<div class="li">${r.q}× ${r.n}</div>`);
    if(s==='held') h+=`<div class="note v">Le prepariamo quando la cucina è quasi pronta,
      così le ritiri fredde insieme al cibo.</div>`;
    h+=`</div>`;
  }

  h+=`<div class="recap"><div class="row tot">
      <span>${o.paid?'Pagato':'Da pagare al ritiro'}</span><span>${eur(o.tot)}</span></div></div>`;

  // Aggiungi al mio ordine — modificabile finché NON è pagato.
  // Il pagamento (in app o in cassa al ritiro) è ciò che "chiude" l'ordine.
  if(!o.paid){
    h+=`<button class="add-order-btn" onclick="startAddingTo(${o.id})">
      ➕ Aggiungi altro al mio ordine #${o.id}</button>
      <p style="font-size:11px;color:var(--dim);text-align:center;margin:6px 0 14px">
      Puoi aggiungere finché non paghi (in app o al ritiro in cassa).</p>`;
  } else {
    h+=`<div style="text-align:center;font-size:11.5px;color:var(--dim);margin:14px 0;
      padding:10px;background:var(--panel);border:1px dashed var(--line);border-radius:10px">
      🔒 Ordine pagato — non più modificabile.
      <br>Per annullare, chiedi alla <b style="color:var(--acc)">cassa</b>.</div>`;
  }

  h+=`<button class="cta ghost" style="width:100%;margin-top:8px" onclick="openHelp(${o.id})">
    🆘 Serve aiuto?</button>
    <p style="font-size:11px;color:var(--dim);text-align:center;margin:8px 0 0">
    Per annullare l'ordine devi passare dalla cassa.</p></div>`;
  return h;
}

function sendProblema(){

function resolveTicket(id){

let soldOutEvents = []; // {orderId, lineIdx, item, expireAt, status}
let soTicker = null;

// Operatore KDS apre picker per segnare quale articolo è esaurito
function openSoPicker(orderId){
  const o=orders.find(x=>x.id===orderId);
  if(!o) return;
  const rows = o.righe
    .map((r,i)=>({r,i}))
    .filter(x=>['preparing','held'].includes(x.r.stato));
  if(!rows.length){alert('Nessun articolo in preparazione');return}
  document.getElementById('soPicker').innerHTML=`<div class="so-picker">
    <div class="so-pick-card">
      <h4>Quale articolo è finito?</h4>
      ${rows.map(x=>`<div class="so-pick-item" onclick="triggerSoldOut(${orderId},${x.i})">
        <span>${x.r.q}× ${x.r.n}</span><span>⚠️</span></div>`).join('')}
      <button class="help-close" onclick="document.getElementById('soPicker').innerHTML=''">Annulla</button>
    </div></div>`;
}
function triggerSoldOut(orderId, lineIdx){
  document.getElementById('soPicker').innerHTML='';
  const o=orders.find(x=>x.id===orderId);
  const line=o.righe[lineIdx];
  soldOutEvents.push({orderId, lineIdx, item: line.n, expireAt: now()+60000, status:'pending'});
  log(role,'stock',`⚠️ #${orderId} — «${line.n}» ESAURITO in preparazione, cliente avvisato con timer 60s`,true);
  // Auto-set mine so cliente demo lo veda
  o.mine = true;
  if(!soTicker) soTicker = setInterval(soTick, 1000);
  draw();
}
function soTick(){
  let anyActive = false;
  soldOutEvents.forEach(e=>{
    if(e.status==='pending'){
      if(e.expireAt <= now()){
        // Timeout: rimborso automatico solo dell'articolo
        const o=orders.find(x=>x.id===e.orderId);
        const line = o?.righe?.[e.lineIdx];
        if(line){
          line.stato='refunded';
          log('sistema','ordine',`#${e.orderId} — TIMEOUT · rimborso automatico ${e.item}, resto dell'ordine prosegue`,true);
        }
        e.status='timeout';
      } else {
        anyActive = true;
      }
    }
  });
  if(!anyActive){clearInterval(soTicker);soTicker=null}
  draw();
}
function soChoice(idx, choice){
  const e = soldOutEvents[idx];
  const o = orders.find(x=>x.id===e.orderId);
  const line = o.righe[e.lineIdx];
  if(choice==='rimuovi'){
    line.stato='refunded';
    log('cliente','ordine',`#${e.orderId} — cliente sceglie rimborso di ${e.item}`);
    e.status='removed';
  } else if(choice==='sostituisci'){
    // Trova alternativa: primo altro articolo della stessa stazione
    const alt = ITEMS.find(it=>cat(it.c).staz===line.staz && it.n!==line.n && !it.out);
    if(alt){
      line.n = alt.n;
      log('cliente','ordine',`#${e.orderId} — ${e.item} sostituito con ${alt.n}`);
    }
    e.status='substituted';
  } else if(choice==='menu'){
    line.stato='refunded';
    addingTo = e.orderId;
    view = 'menu';
    log('cliente','ordine',`#${e.orderId} — cliente apre menu per scegliere alternativa`);
    e.status='menu';
  }
  draw();
}
function renderSoldOutModal(){
  const active = soldOutEvents.find(e=>e.status==='pending');
  if(!active){document.getElementById('soMask').innerHTML='';return false}
  const idx = soldOutEvents.indexOf(active);
  const secLeft = Math.max(0, Math.ceil((active.expireAt-now())/1000));
  const pct = secLeft/60;
  const circ = 2*Math.PI*24, off = circ*(1-pct);
  document.getElementById('soMask').innerHTML=`<div class="so-mask">
    <div class="so-card">
      <h3>⚠️ Un articolo è finito</h3>
      <div class="sos">Ci scusiamo: <b>${active.item}</b> del tuo ordine <b>#${active.orderId}</b>
      è esaurito adesso. Come vuoi procedere?</div>
      <div class="so-timer">
        <div class="so-ring">
          <svg viewBox="0 0 56 56">
            <circle class="bg-r" cx="28" cy="28" r="24"/>
            <circle class="fg-r" cx="28" cy="28" r="24" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/>
          </svg>
          <div class="num">${secLeft}</div>
        </div>
        <div class="st"><b>Rispondi entro 60 secondi</b>
        Altrimenti rimborsiamo solo questo articolo, il resto dell'ordine prosegue.</div>
      </div>
      <button class="so-opt" onclick="soChoice(${idx},'sostituisci')">
        <div class="soi">🔄</div><div><div class="sot">Sostituisci con un'alternativa</div>
        <div class="sod">Ti proponiamo un articolo simile allo stesso prezzo</div></div></button>
      <button class="so-opt" onclick="soChoice(${idx},'menu')">
        <div class="soi">📋</div><div><div class="sot">Riapri il menu, scelgo io</div>
        <div class="sod">Rimborso questo articolo e aggiungi altro all'ordine</div></div></button>
      <button class="so-opt" onclick="soChoice(${idx},'rimuovi')">

        <div class="sod">Rimborso, il resto continua normalmente</div></div></button>
    </div></div>`;
  return true;
}

/* ================= KDS ================= */
function viewKDS(st){
  const mine=o=>o.righe.filter(r=>st==='bar'?isDrink(r.staz):r.staz==='cucina');
  const list=orders.filter(o=>o.stato!=='closed'&&mine(o).length
    && mine(o).some(r=>r.stato!=='collected')).sort((a,b)=>a.t0-b.t0);
  checkNewOrdersForKds(st);
  let h=`<div class="kds"><div class="kdshead"><h2>${st==='bar'?'🍹 Bar':'🍕 Cucina'}</h2>
    <div class="stat"><div><b>${list.length}</b>ordini aperti</div>
    <div><b>${queueOf(st)}</b>righe attive</div></div></div>`;
  if(!list.length) return h+`<div class="empty">Nessun ordine.<br>Passa a "Cliente" e mandane uno.</div></div>`;
  h+=`<div class="cols">`;
  for(const o of list){
    const rs=mine(o), s=stGroup(rs);
    const min=Math.floor((now()-o.t0)/60000), late=min>o.eta&&s!=='ready';
    const fresh=isFreshFor(st,o.id);
    const cls=(s==='held'?'held':s==='ready'?'rdy':s==='preparing'?'prep':late?'late':'')+(fresh?' fresh':'');
    h+=`<div class="card ${cls}"><div class="top"><div class="no">${o.id}</div>
      <div class="tm">${min}′ / ${o.eta}′</div></div>
      <div class="who">${o.nome}${o.paid?' <span class="paid-badge">💳 PAGATO</span>':''}</div>`;
    rs.forEach(r=>h+=`<div class="line"><b>${r.q}×</b><span>${r.n}</span></div>`);

    if(st==='bar'&&s==='held'){
      h+=`<div class="note v">🔒 Abbinate al cibo — partono quando la cucina sblocca</div>
          <button class="act b" disabled>In attesa della cucina</button>`;
    } else if(s==='ready'){
      h+=`<button class="act b" disabled>✅ Pronto — al ritiro</button>`;
    } else {
      const held=o.righe.some(r=>r.stato==='held');
      if(st==='cucina'&&held)
        h+=`<div class="note o">🍺 Ci sono bibite abbinate da sbloccare</div>
            <button class="act v" onclick="sblocca(${o.id})">Manca poco (~3′) — libera le bibite</button>`;
      h+=`<button class="act g" onclick="pronto(${o.id},'${st}')">Segna PRONTO</button>
          <button class="kds-so-btn" onclick="openSoPicker(${o.id})">⚠️ Un articolo è esaurito</button>`;
    }
    h+=`</div>`;
  }
  return h+`</div></div>`;
}
function chiedi(id){orders.find(o=>o.id===id).askedAt=now();
  log(role,'ordine',`#${id} richiesta conferma presenza al cliente`);draw()}
function sblocca(id){orders.find(o=>o.id===id).righe
  .filter(r=>r.stato==='held').forEach(r=>r.stato='preparing');
  log('cucina','ordine',`#${id} bibite sbloccate al bar (cucina quasi pronta)`);draw()}
function pronto(id,st){const o=orders.find(x=>x.id===id);
  o.righe.filter(r=>st==='bar'?isDrink(r.staz):r.staz==='cucina')
    .filter(r=>r.stato!=='collected').forEach(r=>r.stato='ready');
  log(st,'ordine',`#${id} segnato PRONTO da ${st} dopo ${Math.floor((now()-o.t0)/60000)}′ (stima ${o.eta}′)`,
    Math.floor((now()-o.t0)/60000)>o.eta);draw()}

/* ================= CASSA / RITIRO ================= */
function viewCassa(){
  // La cassa ora vede TUTTI gli ordini attivi (non solo pronti):
  //  - Pronti: può incassare/consegnare
  //  - In preparazione/held: SOLO annullare (se il cliente lo chiede al banco)
  const list=orders.filter(o=>o.stato!=='closed');
  const readyN = list.filter(o=>o.righe.some(r=>r.stato==='ready')).length;
  const daIncassare = list.filter(o=>!o.paid && o.righe.some(r=>r.stato==='ready')).length;
  let h=`<div class="kds"><div class="kdshead"><h2>💶 Banchi ritiro</h2>
    <div class="stat"><div><b>${readyN}</b>da consegnare</div>
    <div><b>${daIncassare}</b>da incassare</div>
    <div><b>${list.length-readyN}</b>in preparazione</div></div></div>`;
  if(!list.length) return h+`<div class="empty">Nessun ordine attivo.</div></div>`;
  h+=`<div class="cols">`;
  for(const o of list){
    const hasReady = o.righe.some(r=>r.stato==='ready');
    const onlyInPrep = !hasReady;
    h+=`<div class="card ${o.paid?'rdy':''} ${onlyInPrep?'held':''}" style="opacity:1"><div class="top"><div class="no">${o.id}</div>
      <div class="tm" style="color:${o.paid?'var(--acc2)':'var(--acc)'};font-size:${hasReady?'19':'14'}px;font-weight:800">
      ${o.paid?'💳 PAGATO':eur(o.tot)}</div></div>
      <div class="who">${o.nome} · ${o.email}</div>`;

    if(onlyInPrep){
      // Ordine in preparazione — cassa vede solo azione "Annulla"
      h+=`<div class="line" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-size:12px;color:var(--dim)">
        ⏳ In preparazione (${o.righe.length} righe) — non ancora pronto</div>
        <button class="kds-so-btn" onclick="cassaAnnulla(${o.id})" style="color:var(--bad);border-color:var(--bad);margin-top:10px">
          ❌ Annulla questo ordine (cliente al banco)</button>`;
    } else {
      for(const [k,rs] of Object.entries(grouped(o))){
        const s=stGroup(rs); if(s==='collected') continue;
        h+=`<div class="line" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px">
          <b style="color:var(--dim);font-size:11px">${k==='bar'?'BAR':'CUCINA'}</b>
          <span style="font-size:13px">${rs.map(r=>r.q+'× '+r.n).join(', ')}</span></div>`;
        if(s==='ready') h+=`<button class="act ${o.paid?'g':''}" onclick="consegna(${o.id},'${k}')">
          ${o.paid?'✓ Consegna '+(k==='bar'?'bibite':'cibo'):'Incassa '+eur(o.tot)+' e consegna'}</button>`;
        else h+=`<button class="act b" disabled>${k==='bar'?'Bibite':'Cibo'} non ancora pronto</button>`;
      }
    }
    h+=`</div>`;
  }
  return h+`</div></div>`;
}
function cassaAnnulla(id){
  const o=orders.find(x=>x.id===id);
  if(!o) return;
  if(!confirm(`Confermi l'annullamento dell'ordine #${id} (${o.nome}, ${eur(o.tot)})?\n\nIl cliente sarà rimborsato se ha già pagato.`)) return;
  log('cassa','ordine',`#${id} ANNULLATO in cassa · ${eur(o.tot)} · ${o.paid?'rimborso emesso':'non pagato'}`,true);
  orders = orders.filter(x=>x.id!==id);
  draw();
}
function consegna(id,k){
  const o=orders.find(x=>x.id===id);
  if(!o.paid) log('cassa','incasso',`#${id} INCASSATO ${eur(o.tot)} · scontrino emesso su RT`);
  log('cassa','ordine',`#${id} consegnato al banco ${k==='bar'?'BAR':'CUCINA'}`);
  o.paid=true;
  o.righe.filter(r=>(k==='bar')===isDrink(r.staz)&&r.stato==='ready').forEach(r=>r.stato='collected');
  if(o.righe.every(r=>r.stato==='collected')){o.stato='closed';o.mine=false}
  draw();
}

/* ------ SUONO "DING" + TRACKING NUOVI ORDINI ------ */
let audioCtx = null;
function ding(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.setValueAtTime(880, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime+0.08);
    g.gain.setValueAtTime(0.25, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.4);
    o.start(); o.stop(audioCtx.currentTime+0.4);
  }catch(e){}
}
// Traccia quali ordini ha già "visto" ciascuna stazione (per il "NUOVO" badge)
const seenOrders = { bar: new Set(), cucina: new Set() };
function isFreshFor(st, orderId){
  if(seenOrders[st] && !seenOrders[st].has(orderId)){
    seenOrders[st].add(orderId);
    return true;
  }
  return false;
}
// All'ingresso in KDS, contiamo nuovi ordini per suonare il ding
function checkNewOrdersForKds(st){
  const relevant = orders.filter(o=>o.stato!=='closed' && o.righe.some(r=>
    (st==='bar' ? isDrink(r.staz) : r.staz==='cucina')));
  let hasNew = false;
  relevant.forEach(o=>{
    if(seenOrders[st] && !seenOrders[st].has(o.id)){
      hasNew = true;
    }
  });
  if(hasNew) ding();
}
