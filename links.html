<style>
:root{
  --bg:#fec144; --panel:#ffd876; --panel2:#ffe7ad;
  --line:rgba(33,60,79,.25); --txt:#213c4f; --dim:rgba(33,60,79,.65);
  --acc:#213c4f; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:linear-gradient(180deg,#ffe9b0 0%,#fec144 55%,#ffcf5c 100%);
  background-attachment:fixed;min-height:100vh;color:var(--txt);
  font:15px/1.45 'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
h1,h2,.btn-main,.soc-lbl{font-family:'Anton',-apple-system,"Segoe UI",Roboto,sans-serif;
  font-weight:400;letter-spacing:.5px;text-transform:uppercase}
button,a{font-size:inherit;line-height:inherit;cursor:pointer;border:none;background:none;
  color:inherit;text-decoration:none;font-family:inherit}

/* --- pattern scacchi brand --- */
.check{height:12px;background:repeating-conic-gradient(var(--acc) 0% 25%, var(--bg) 0% 50%) 0/24px 24px;
  border-top:2px solid var(--acc);border-bottom:2px solid var(--acc)}

/* ---------- SPLASHSCREEN ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:40px 24px;text-align:center;
  background:linear-gradient(180deg,#ffe9b0 0%,#fec144 60%,#ffcf5c 100%);overflow:hidden;
  transition:opacity .7s ease,visibility .7s ease}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}

#splashVid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .7s ease;z-index:0}
#splashVid.on{opacity:1}
#splash.out #splashVid{opacity:0}
#splash.novid #splashVid{display:none}
#splash .check{position:absolute;left:0;right:0;z-index:3;transition:opacity .4s ease}
/* le bande sono gia' dentro al video: niente doppione */
#splash.on-video:not(.out) .check{opacity:0}
#splash .check.top{top:0}
#splash .check.bot{bottom:0}
.splash-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}

#splash img.mark{width:170px;max-width:56vw;height:auto;margin-bottom:24px;
  filter:drop-shadow(0 14px 34px rgba(33,60,79,.45)) drop-shadow(0 0 18px rgba(255,233,176,.9));
  animation:markIn 1.1s cubic-bezier(.22,1,.36,1) both, float 4.5s 1.1s ease-in-out infinite}
#splash .welcome{font-size:13px;font-weight:800;letter-spacing:2.6px;text-transform:uppercase;
  color:var(--dim);margin-bottom:8px;text-shadow:0 1px 10px rgba(255,233,176,.95);
  animation:fadeUp .7s .35s ease both}
#splash h1{font-size:clamp(28px,8.5vw,40px);line-height:1.08;margin:0;max-width:340px;
  color:var(--txt);text-shadow:0 2px 14px rgba(255,233,176,.9),0 1px 3px rgba(255,233,176,.95);
  animation:fadeUp .7s .5s ease both}
#splash .tap{margin-top:30px;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
  font-weight:700;color:var(--dim);
  animation:fadeUp .6s 1.4s ease both,blink 2.2s 2s ease-in-out infinite}

@keyframes markIn{0%{transform:scale(.7) translateY(14px);opacity:0;filter:blur(6px)}
  100%{transform:scale(1) translateY(0);opacity:1;filter:blur(0)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.6deg) scale(1)}
  50%{transform:translateY(-11px) rotate(.6deg) scale(1.025)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:.7}50%{opacity:.28}}

/* ---------- PAGINA LINK ---------- */
/* strisce a scacchi come nella demo */
.strip{position:fixed;left:0;right:0;z-index:20;opacity:0;transition:opacity .6s .25s ease}
.strip.top{top:0}
.strip.bot{bottom:0}
.page.in~.strip,body.entered .strip{opacity:1}

.page{max-width:440px;margin:0 auto;padding:46px 20px 60px;
  opacity:0;transition:opacity .5s ease}
.page.in{opacity:1}
/* i tasti compaiono uno dopo l'altro */
.page>*{opacity:0;transform:translateY(16px)}
.page.in>*{animation:riseIn .55s cubic-bezier(.22,1,.36,1) both}
.page.in>*:nth-child(1){animation-delay:.10s}
.page.in>*:nth-child(2){animation-delay:.24s}
.page.in>*:nth-child(3){animation-delay:.34s}
.page.in>*:nth-child(4){animation-delay:.44s}
.page.in>*:nth-child(5){animation-delay:.56s}
@keyframes riseIn{to{opacity:1;transform:none}}
.hero{text-align:center;margin-bottom:30px}
.hero img{width:96px;height:auto;margin:0 auto 16px;display:block;
  filter:drop-shadow(0 8px 24px rgba(33,60,79,.28))}
.hero h1{font-size:clamp(23px,6.2vw,29px);line-height:1.1;margin:0 0 10px}
.hero .loc{display:inline-flex;align-items:center;gap:7px;background:rgba(33,60,79,.08);
  border:1.5px solid rgba(33,60,79,.15);border-radius:99px;padding:7px 16px;
  font-size:12.5px;font-weight:700;color:var(--txt);letter-spacing:.3px}
.hero .loc .dot{width:7px;height:7px;border-radius:50%;background:#3ddc84;
  box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:pulseDot 2s ease-in-out infinite}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(61,220,132,.6)}
  50%{box-shadow:0 0 0 8px rgba(61,220,132,0)}}

.btn-main{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;
  padding:19px 20px;border-radius:var(--r);font-size:17px;margin-bottom:12px;
  background:var(--acc);color:var(--bg);border:2px solid var(--acc);
  box-shadow:0 8px 22px rgba(33,60,79,.22);transition:transform .15s,box-shadow .15s}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(33,60,79,.3)}
.btn-main:active{transform:translateY(0)}
.btn-main.ghost{background:var(--panel2);color:var(--acc);box-shadow:0 6px 18px rgba(33,60,79,.12)}
.btn-main.ghost:hover{box-shadow:0 10px 24px rgba(33,60,79,.2)}
.btn-main svg{flex-shrink:0}

/* collapsable "Seguici" */
.coll{margin-bottom:12px}
.coll-head{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;
  padding:19px 20px;border-radius:var(--r);font-size:17px;
  background:var(--panel);color:var(--acc);border:2px solid var(--acc);
  font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.5px;text-transform:uppercase;
  transition:transform .15s,border-radius .25s}
.coll-head:hover{transform:translateY(-2px)}
.coll.open .coll-head{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-width:0}
.coll-head .chev{transition:transform .3s cubic-bezier(.4,0,.2,1);margin-left:2px}
.coll.open .coll-head .chev{transform:rotate(180deg)}
.coll-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.coll.open .coll-body{max-height:200px}
.socials{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;
  padding:14px;background:var(--panel);border:2px solid var(--acc);border-top:none;
  border-radius:0 0 var(--r) var(--r)}
.soc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  padding:15px 6px;border-radius:12px;color:#fff;
  transition:transform .15s,filter .15s;box-shadow:0 4px 12px rgba(33,60,79,.18)}
.soc:hover{transform:translateY(-2px);filter:brightness(1.1)}
.soc svg{width:25px;height:25px}
.soc-lbl{font-size:11.5px;letter-spacing:.8px}
.soc.ig{background:linear-gradient(45deg,#f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%)}
.soc.tt{background:#010101}
.soc.tt svg .tt-c{fill:#25f4ee}.soc.tt svg .tt-m{fill:#fe2c55}
.soc.fb{background:#1877f2}

/* pulsanti recensione */
.rev{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px 12px;
  border-radius:12px;font-weight:800;font-size:14px;color:#fff;
  transition:transform .15s,filter .15s;box-shadow:0 4px 12px rgba(33,60,79,.18)}
.rev:hover{transform:translateY(-2px);filter:brightness(1.08)}
.rev+.rev{margin-top:9px}
.rev.google{background:#fff;color:#3c4043;border:1px solid #dadce0}
.rev.trip{background:#000;color:#fff}
.rev .stars{color:#fbbc04;letter-spacing:1px;font-size:13px}
.rev-wrap{padding:14px;background:var(--panel);border:2px solid var(--acc);border-top:none;
  border-radius:0 0 var(--r) var(--r)}

.foot{text-align:center;margin-top:30px;font-size:11px;color:var(--dim);
  letter-spacing:.4px;line-height:1.6}
.foot a{text-decoration:underline;color:var(--dim)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
  var splash=document.getElementById('splash'),
      page=document.getElementById('page'),
      vid=document.getElementById('splashVid'),
      done=false, timer=null;

  function enter(){
    if(done) return; done=true;
    clearTimeout(timer);
    var hadVideo=splash.classList.contains('on-video');
    // 1. il video sfuma sul giallo, il logo resta
    splash.classList.add('out');
    setTimeout(function(){
      // 2. la splash sfuma e i tasti salgono a scaglioni
      if(vid){ try{ vid.pause(); }catch(e){} }
      splash.classList.add('hide');
      page.classList.add('in');
      document.body.classList.add('entered');
      setTimeout(function(){ if(splash.parentNode) splash.remove(); },900);
    }, hadVideo?600:0);
  }
  function fallback(){           // niente video: splash gialla statica
    splash.classList.add('novid');
    clearTimeout(timer);
    timer=setTimeout(enter,2400);
  }

  // finche' il video non dimostra di partire, resta la splash gialla
  timer=setTimeout(enter,2400);

  if(vid){
    var started=false;
    var giveUp=setTimeout(function(){ if(!started) fallback(); },1600);
    vid.addEventListener('playing',function(){
      if(started) return; started=true;
      clearTimeout(giveUp); clearTimeout(timer);
      splash.classList.remove('novid');
      splash.classList.add('on-video');
      vid.classList.add('on');
      // esce a fine video, con un margine di sicurezza
      timer=setTimeout(enter,(isFinite(vid.duration)?vid.duration*1000:5000)+250);
    });
    vid.addEventListener('ended',enter);
    vid.addEventListener('error',fallback);
    var pr=vid.play();
    if(pr&&pr.catch) pr.catch(fallback);   // autoplay bloccato
  }else{ fallback(); }

  splash.addEventListener('click',enter);
  document.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' ') enter(); });

  function wire(cId,bId,other){
    var c=document.getElementById(cId), b=document.getElementById(bId);
    b.addEventListener('click',function(){
      var open=c.classList.toggle('open');
      b.setAttribute('aria-expanded',open?'true':'false');
      if(open&&other){var o=document.getElementById(other);
        o.classList.remove('open');
        o.querySelector('.coll-head').setAttribute('aria-expanded','false');}
    });
  }
  wire('coll','collBtn','coll2');
  wire('coll2','collBtn2','coll');
})();
</script>
</body>
</html>
